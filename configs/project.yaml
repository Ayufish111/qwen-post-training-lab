project_name: Qwen3-Chinese-Post-Training
seed: 42

model:
  name: Qwen/Qwen3-4B-Base
  revision: main
  trust_remote_code: false
  max_seq_length: 1024

data:
  sft_source: AI-ModelScope/Infinity-Instruct
  sft_subset: 7M
  full_clean_size: 10000
  ablation_size: 2000
  split_ratio: 0.95
  current_sft_status: approved

qlora:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05

sft:
  output_dir: outputs/sft
  num_train_epochs: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: linear
  warmup_ratio: 0.05
  logging_steps: 10

experiments:
  S1:
    train_split: ablation_clean_train
    validation_split: ablation_clean_validation
    target_strategy: attention
    max_steps: 200
    num_train_epochs: 1
  S2:
    train_split: ablation_clean_train
    validation_split: ablation_clean_validation
    target_strategy: all-linear
    max_steps: 200
    num_train_epochs: 1
  S3:
    train_split: ablation_raw_train
    validation_split: ablation_raw_validation
    target_strategy: null
    max_steps: 200
    num_train_epochs: 1
  S4:
    train_split: full_clean_train
    validation_split: full_clean_validation
    target_strategy: null
    max_steps: -1
    num_train_epochs: 2

evaluation:
  baseline: B0
  primary_instruction_benchmark: Multi-IF-zh
  multi_if_pilot_limit: 100
  multi_if_max_new_tokens: 512
  max_new_tokens: 512
  do_sample: false
